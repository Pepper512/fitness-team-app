name = "fitness-team-whoop"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# Where to send the user back after connecting (your live app, WITH trailing slash):
APP_URL = "https://pepper512.github.io/fitness-team-app/"
# Which origin may call this Worker from the browser (scheme + host only, NO path):
ALLOW_ORIGIN = "https://pepper512.github.io"

# Secrets are NOT stored here. Set them once after deploy:
#   npx wrangler secret put WHOOP_CLIENT_ID
#   npx wrangler secret put WHOOP_CLIENT_SECRET